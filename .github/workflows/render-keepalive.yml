name: Keep EFRA Render Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping EFRA status endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL="https://efra-microstructure-paper-live.onrender.com/api/paper-status"
          for attempt in 1 2 3 4 5; do
            code="$(curl -L -sS -o /tmp/efra.json -w '%{http_code}' --max-time 25 "$URL" || true)"
            echo "attempt=$attempt http=$code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          cat /tmp/efra.json 2>/dev/null || true
          exit 1
