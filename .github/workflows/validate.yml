name: Validate EFRA Python

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile EFRA runtime
        run: |
          python -m py_compile \
            efra_bot.py \
            efra_web.py \
            efra_store.py \
            efra_dashboard.py \
            efra_stream.py \
            efra_report.py \
            efra_research.py
      - name: Validate VPS installer
        run: |
          bash -n deploy/vps/install.sh
