services:
  efra-sniper-v2:
    build:
      context: /opt/app-platform/src/efra-sniper-v2
      dockerfile: Dockerfile.vps
    container_name: efra-sniper-v2
    restart: unless-stopped
    env_file:
      - /opt/app-platform/secrets/efra-sniper-v2.env
    ports:
      - "127.0.0.1:${EFRA_HOST_PORT:-18085}:8080"
    volumes:
      - /opt/app-platform/state/efra-sniper-v2:/data
      - /opt/app-platform/state/efra-research:/research:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).read()"
      interval: 30s
      timeout: 8s
      retries: 5
      start_period: 45s
